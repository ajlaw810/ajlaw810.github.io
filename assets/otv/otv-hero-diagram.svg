<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(200, 109, 81, 0.08)" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2925" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1F1D19" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C86D51"/>
      <stop offset="100%" stop-color="#E07A5F"/>
    </linearGradient>
    <linearGradient id="rampGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DDA15E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C86D51" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#161513"/>
  <rect width="100%" height="100%" fill="url(#cadGrid)"/>

  <!-- Dimension Markers and Coordinate Crosshairs -->
  <g stroke="rgba(200, 109, 81, 0.3)" stroke-width="1">
    <line x1="40" y1="40" x2="60" y2="40"/>
    <line x1="50" y1="30" x2="50" y2="50"/>
    <line x1="840" y1="40" x2="860" y2="40"/>
    <line x1="850" y1="30" x2="850" y2="50"/>
    <line x1="40" y1="460" x2="60" y2="460"/>
    <line x1="50" y1="450" x2="50" y2="470"/>
    <line x1="840" y1="460" x2="860" y2="460"/>
    <line x1="850" y1="450" x2="850" y2="470"/>
  </g>

  <!-- Technical Dimension Overlay -->
  <g font-family="'Space Grotesk', monospace" font-size="11" fill="#888377">
    <text x="60" y="45">DIM: 14.04&quot; × 6.83&quot; [356.6 × 173.5 mm]</text>
    <text x="60" y="62">CHASSIS: 3mm LASER-CUT ACRYLIC BOX</text>
    <text x="830" y="45" text-anchor="end">TOTAL MASS: 1.09 kg</text>
    <text x="830" y="62" text-anchor="end">SYSTEM SCORE: 120/100 (1ST PLACE)</text>
  </g>

  <!-- Ground Plane Reference -->
  <line x1="120" y1="410" x2="780" y2="410" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Main Chassis Structure -->
  <!-- Left/Right Drive Wheels (90mm rubber) -->
  <g>
    <!-- Left Wheel (Far Side) -->
    <ellipse cx="320" cy="355" rx="28" ry="48" fill="#1F1D19" stroke="#4A4843" stroke-width="2"/>
    <!-- Right Wheel (Near Side) -->
    <ellipse cx="360" cy="375" rx="32" ry="52" fill="#25231F" stroke="#C86D51" stroke-width="2.5"/>
    <ellipse cx="360" cy="375" rx="16" ry="26" fill="#161513" stroke="#888377" stroke-width="1.5"/>
    <circle cx="360" cy="375" r="4" fill="#E07A5F"/>
    <!-- Wheel Tread Pattern -->
    <path d="M 345 330 L 375 335 M 335 360 L 385 365 M 338 395 L 382 400" stroke="#C86D51" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Laser-Cut Acrylic Main Body -->
  <polygon points="260,330 600,270 660,305 320,365" fill="url(#chassisGrad)" stroke="rgba(200, 109, 81, 0.6)" stroke-width="2"/>
  <polygon points="260,330 320,365 320,395 260,360" fill="#1F1D19" stroke="#4A4843" stroke-width="1.5"/>
  <polygon points="320,365 660,305 660,335 320,395" fill="#25231F" stroke="#4A4843" stroke-width="1.5"/>

  <!-- Finger Joint Details along edges -->
  <g stroke="#C86D51" stroke-width="1.5" fill="none">
    <path d="M 280,326 l 8,-1.5 v -4 l -8,1.5 z M 340,315 l 8,-1.5 v -4 l -8,1.5 z M 420,301 l 8,-1.5 v -4 l -8,1.5 z M 500,287 l 8,-1.5 v -4 l -8,1.5 z"/>
  </g>

  <!-- Passive Specimen Capture Ramp (Front Scoop) -->
  <polygon points="200,385 280,330 330,360 250,415" fill="url(#rampGrad)" stroke="#E07A5F" stroke-width="2"/>
  <!-- Flexible Polymer Lip and Brace -->
  <polygon points="180,395 210,380 255,413 225,428" fill="#DDA15E" stroke="#DDA15E" stroke-width="1.5" opacity="0.85"/>
  <!-- Specimen Sitting on Ramp (Foam/Plastic Cylinder) -->
  <g>
    <ellipse cx="255" cy="370" rx="16" ry="24" fill="#DDA15E" stroke="#FFF" stroke-width="1.5"/>
    <path d="M 239,370 v -18 a 16 24 0 0 1 32 0 v 18 z" fill="rgba(221, 161, 94, 0.8)" stroke="#FFF" stroke-width="1.5"/>
  </g>

  <!-- Floating Strain Gauge Scale Platform (HX711 Interface) -->
  <polygon points="360,310 440,295 470,312 390,327" fill="rgba(200, 109, 81, 0.25)" stroke="#C86D51" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="415" cy="311" r="5" fill="#C86D51"/>

  <!-- Rear Omnidirectional Ball Caster -->
  <ellipse cx="630" cy="345" rx="14" ry="14" fill="#4A4843" stroke="#BBB6AA" stroke-width="1.5"/>
  <circle cx="630" cy="347" r="8" fill="#E5B074"/>

  <!-- Overhead ArUco Marker Mast / Vision Target -->
  <line x1="480" y1="290" x2="480" y2="160" stroke="#C86D51" stroke-width="2"/>
  <rect x="450" y="110" width="60" height="50" fill="#FFF" stroke="#C86D51" stroke-width="2" rx="3"/>
  <!-- ArUco Binary Matrix Grid -->
  <rect x="455" y="115" width="50" height="40" fill="#000"/>
  <rect x="462" y="122" width="12" height="12" fill="#FFF"/>
  <rect x="486" y="122" width="12" height="12" fill="#FFF"/>
  <rect x="474" y="136" width="12" height="12" fill="#FFF"/>
  <text x="480" y="98" font-family="'Space Grotesk', monospace" font-size="10" fill="#C86D51" text-anchor="middle" font-weight="bold">ARUCO VISION MAST</text>

  <!-- Technical Callout Lines and Badges -->
  <!-- Callout 1: Ramp -->
  <line x1="215" y1="410" x2="130" y2="450" stroke="#E07A5F" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="215" cy="410" r="3" fill="#E07A5F"/>
  <text x="125" y="465" font-family="'Space Grotesk', monospace" font-size="10" fill="#E07A5F" font-weight="bold">PASSIVE FRICTION SCOOP</text>
  <text x="125" y="478" font-family="'Inter', sans-serif" font-size="9" fill="#BBB6AA">Zero-Reprint Flexible Lip</text>

  <!-- Callout 2: Drive Wheels -->
  <line x1="360" y1="375" x2="360" y2="450" stroke="#C86D51" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="360" cy="375" r="3" fill="#C86D51"/>
  <text x="360" y="465" font-family="'Space Grotesk', monospace" font-size="10" fill="#C86D51" text-anchor="middle" font-weight="bold">DUAL POLOLU 12V DC MOTORS</text>
  <text x="360" y="478" font-family="'Inter', sans-serif" font-size="9" fill="#BBB6AA" text-anchor="middle">90mm Wheels • 0.11 N-cm Start Torque</text>

  <!-- Callout 3: Load Cell -->
  <line x1="415" y1="311" x2="415" y2="220" stroke="#DDA15E" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="415" cy="311" r="3" fill="#DDA15E"/>
  <text x="415" y="205" font-family="'Space Grotesk', monospace" font-size="10" fill="#DDA15E" text-anchor="middle" font-weight="bold">HX711 24-BIT LOAD CELL</text>
  <text x="415" y="218" font-family="'Inter', sans-serif" font-size="9" fill="#BBB6AA" text-anchor="middle">Dual Half-Bridge Strain Gauges</text>

  <!-- Callout 4: Ball Caster -->
  <line x1="630" y1="355" x2="720" y2="410" stroke="#888377" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="630" cy="355" r="3" fill="#888377"/>
  <text x="725" y="415" font-family="'Space Grotesk', monospace" font-size="10" fill="#BBB6AA" font-weight="bold">OMNIDIRECTIONAL CASTER</text>
  <text x="725" y="428" font-family="'Inter', sans-serif" font-size="9" fill="#888377">Zero-Radius Turn Radius</text>
</svg>